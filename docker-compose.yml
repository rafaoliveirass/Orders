services:
  # Serviço do Banco de Dados
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 2m

  web-app:
    image: orders-api:latest
    build:
      context: .
      dockerfile: Orders.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=orders;Username=postgres;Password=admin
      - ASPNETCORE_URLS=http://+:8080
      - JwtSettings__Issuer=localhost
      - JwtSettings__Audience=localhost
      - JwtSettings__SecretKey=CHAVEJWTCHAVEJWTCHAVEJWTCHAVEJWTCHAVEJWTCHAVEJWTCHAVEJWTCHAVEJWTCHAVEJWTCHAVEJWT
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: